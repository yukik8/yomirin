<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
<title>よみりん — システムの文脈(C4 レベル1)</title>
<defs>
<marker id="a-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534ab7"/></marker>
<marker id="a-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker>
<marker id="a-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29d"/></marker>
<marker id="a-egress" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<rect width="1600" height="1060" fill="#ffffff"/>
<!-- 枠 -->
<!-- 線 -->
<path d="M300,355 L300,535 L560,535" fill="none" stroke="#a3a29d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-user)"/>
<path d="M425,275 L1160,275" fill="none" stroke="#a3a29d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a-user)"/>
<path d="M1040,480 L1340,480 L1340,350" fill="none" stroke="#3d3d3a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a-call)"/>
<path d="M1040,590 L1340,590 L1340,700" fill="none" stroke="#3d3d3a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a-call)"/>
<path d="M800,630 L800,840" fill="none" stroke="#c2410c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a-egress)"/>
<!-- 箱 -->
<!-- 利用者 -->
<rect x="175" y="220" width="250" height="135" rx="30" fill="#eeedfe" stroke="#534ab7" stroke-width="1.8"/>
<circle cx="300" cy="200" r="28" fill="#eeedfe" stroke="#534ab7" stroke-width="1.8"/>
<text x="300" y="261.93" text-anchor="middle" font-size="16" font-weight="700" fill="#26215c">利用者</text>
<text x="300" y="280.52" text-anchor="middle" font-size="11.5" fill="#5f5e5a">[人]</text>
<text x="300" y="304" text-anchor="middle" font-size="12.5" fill="#26215c">Google Play ブックス(ウェブ版)で</text>
<text x="300" y="322.5" text-anchor="middle" font-size="12.5" fill="#26215c">本を読む人。スマホに逃げずに</text>
<text x="300" y="341" text-anchor="middle" font-size="12.5" fill="#26215c">読む時間を伸ばしたい</text>
<!-- よみりん -->
<rect x="560" y="440" width="480" height="190" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="2.6"/>
<text x="800" y="506.31" text-anchor="middle" font-size="22" font-weight="700" fill="#04342c">よみりん</text>
<text x="800" y="525.02" text-anchor="middle" font-size="11.5" fill="#5f5e5a">[ソフトウェアシステム: Chrome 拡張 + うんちくサーバ]</text>
<text x="800" y="548.5" text-anchor="middle" font-size="12.5" fill="#04342c">読書中だけ動き、読む時間を支える演出を出す。</text>
<text x="800" y="567" text-anchor="middle" font-size="12.5" fill="#04342c">その量 θ を、本人が気づかない速度で 0 へ減らす。</text>
<text x="800" y="585.5" text-anchor="middle" font-size="12.5" fill="#04342c">読んだ記録と、自分からの問いは減らさずに残す。</text>
<!-- Google Play ブックス -->
<rect x="1160" y="200" width="360" height="150" rx="8" fill="#e8edf4" stroke="#5b6b7f" stroke-width="1.6"/>
<text x="1340" y="252.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a37">Google Play ブックス</text>
<text x="1340" y="270.77" text-anchor="middle" font-size="11.5" fill="#5f5e5a">[外部システム: Google のウェブアプリ]</text>
<text x="1340" y="294.25" text-anchor="middle" font-size="12.5" fill="#1f2a37">本を表示するリーダー。</text>
<text x="1340" y="312.75" text-anchor="middle" font-size="12.5" fill="#1f2a37">本文は別ドメインのフレームの中</text>
<!-- Gemini Nano -->
<rect x="1160" y="700" width="360" height="150" rx="8" fill="#e8edf4" stroke="#5b6b7f" stroke-width="1.6"/>
<text x="1340" y="752.2" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a37">Gemini Nano</text>
<text x="1340" y="770.77" text-anchor="middle" font-size="11.5" fill="#5f5e5a">[外部システム: Chrome 内蔵 AI・端末の中]</text>
<text x="1340" y="794.25" text-anchor="middle" font-size="12.5" fill="#1f2a37">Prompt API で呼ぶ言語モデル。</text>
<text x="1340" y="812.75" text-anchor="middle" font-size="12.5" fill="#1f2a37">端末の中で完結する</text>
<!-- Anthropic API -->
<rect x="600" y="840" width="400" height="130" rx="8" fill="#e8edf4" stroke="#5b6b7f" stroke-width="1.6"/>
<text x="800" y="891.45" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a37">Anthropic API</text>
<text x="800" y="910.02" text-anchor="middle" font-size="11.5" fill="#5f5e5a">[外部システム: Claude]</text>
<text x="800" y="933.5" text-anchor="middle" font-size="12.5" fill="#1f2a37">うんちくの一言を作る</text>
<!-- 札・見出し・凡例 -->
<text x="40" y="50" font-size="24" font-weight="700" fill="#2c2c2a">よみりん — システムの文脈(C4 レベル1)</text>
<text x="40" y="78" font-size="13" fill="#5f5e5a">誰が使い、よみりんがどの外のシステムと何をやりとりするか。中の作りは「2 コンテナ」へ。v0.26 の構成(2026-10-12)</text>
<rect x="40" y="94" width="117.04" height="22" rx="11" fill="#26215c" stroke="#26215c" stroke-width="1"/>
<text x="98.52" y="109.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1 システムの文脈</text>
<text x="165.04" y="109.5" font-size="13" fill="#a3a29d">›</text>
<rect x="177.04" y="94" width="81.04" height="22" rx="11" fill="#ffffff" stroke="#c9c7bf" stroke-width="1"/>
<text x="217.56" y="109.5" text-anchor="middle" font-size="12" fill="#5f5e5a">2 コンテナ</text>
<text x="266.08" y="109.5" font-size="13" fill="#a3a29d">›</text>
<rect x="278.08" y="94" width="215.92" height="22" rx="11" fill="#ffffff" stroke="#c9c7bf" stroke-width="1"/>
<text x="386.04" y="109.5" text-anchor="middle" font-size="12" fill="#5f5e5a">3 コンポーネント: Service Worker</text>
<text x="502" y="109.5" font-size="13" fill="#a3a29d">›</text>
<rect x="514" y="94" width="172.72" height="22" rx="11" fill="#ffffff" stroke="#c9c7bf" stroke-width="1"/>
<text x="600.36" y="109.5" text-anchor="middle" font-size="12" fill="#5f5e5a">3 コンポーネント: 読書タブ</text>
<text x="694.72" y="109.5" font-size="13" fill="#a3a29d">›</text>
<rect x="706.72" y="94" width="89.68" height="22" rx="11" fill="#ffffff" stroke="#c9c7bf" stroke-width="1"/>
<text x="751.56" y="109.5" text-anchor="middle" font-size="12" fill="#5f5e5a">配置図(補足)</text>
<rect x="223.2" y="429" width="153.5" height="42" rx="4" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<text x="300" y="446" text-anchor="middle" font-size="12.5" fill="#2c2c2a">「読む」で始める・問う</text>
<text x="300" y="463" text-anchor="middle" font-size="12.5" fill="#2c2c2a">記録を振り返る</text>
<rect x="713.2" y="262.5" width="153.5" height="25" rx="4" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<text x="790" y="279.5" text-anchor="middle" font-size="12.5" fill="#2c2c2a">本を読む・ページを送る</text>
<rect x="1250.8" y="385.5" width="178.5" height="59" rx="4" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<text x="1340" y="402.5" text-anchor="middle" font-size="12.5" fill="#2c2c2a">本文と位置を読み取り、</text>
<text x="1340" y="419.5" text-anchor="middle" font-size="12.5" fill="#2c2c2a">本文の外に演出の層を重ねる</text>
<text x="1340" y="436.5" text-anchor="middle" font-size="11" fill="#5f5e5a">[ページは書き換えない]</text>
<rect x="1263.2" y="615.5" width="153.5" height="59" rx="4" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<text x="1340" y="632.5" text-anchor="middle" font-size="12.5" fill="#2c2c2a">クイズ・問いへの回答・</text>
<text x="1340" y="649.5" text-anchor="middle" font-size="12.5" fill="#2c2c2a">うんちくを作ってもらう</text>
<text x="1340" y="666.5" text-anchor="middle" font-size="11" fill="#5f5e5a">[本文は端末の中だけ]</text>
<rect x="664" y="714" width="272.1" height="42" rx="4" fill="#ffffff" stroke="#e6b8a2" stroke-width="1"/>
<text x="800" y="731" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a3412">うんちくの一言を頼む</text>
<text x="800" y="748" text-anchor="middle" font-size="11" fill="#5f5e5a">[HTTPS・同意したときの単語の候補だけ(最大8語)]</text>
<rect x="40" y="1000" width="918.5" height="40" rx="8" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<text x="40" y="994" font-size="12" font-weight="600" fill="#5f5e5a">凡例</text>
<path d="M56,1020 L100,1020" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#a-call)"/>
<text x="110" y="1024.5" font-size="12.5" fill="#2c2c2a">呼び出し・データ</text>
<path d="M236,1020 L280,1020" stroke="#a3a29d" stroke-width="1.6" marker-end="url(#a-user)"/>
<text x="290" y="1024.5" font-size="12.5" fill="#2c2c2a">利用者の操作</text>
<path d="M391,1020 L435,1020" stroke="#c2410c" stroke-width="2.4" marker-end="url(#a-egress)"/>
<text x="445" y="1024.5" font-size="12.5" fill="#2c2c2a">端末の外へ出る</text>
<rect x="558.5" y="1011" width="36" height="18" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.4"/>
<text x="602.5" y="1024.5" font-size="12.5" fill="#2c2c2a">自作・できている</text>
<rect x="728.5" y="1011" width="36" height="18" rx="4" fill="#e8edf4" stroke="#5b6b7f" stroke-width="1.4"/>
<text x="772.5" y="1024.5" font-size="12.5" fill="#2c2c2a">外部のシステム</text>
<circle cx="904" cy="1020" r="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1.4"/>
<text x="930" y="1024.5" font-size="12.5" fill="#2c2c2a">人</text>
</svg>
