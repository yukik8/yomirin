<text x="1200" y="497.77" text-anchor="middle" font-size="11.5" fill="#5f5e5a">[コンポーネント: 本体(本文のフレームだけ)]</text>
<text x="1200" y="521.25" text-anchor="middle" font-size="12.5" fill="#04342c">本文を見つけ、20秒の鼓動で読書時間を計る</text>
