<text x="1200" y="558.25" text-anchor="middle" font-size="12.5" fill="#04342c">θ から枠を計画・クイズとうんちくを作り置く</text>
<text x="1200" y="576.75" text-anchor="middle" font-size="12.5" fill="#04342c">読む速さから、出す時刻を決める</text>
