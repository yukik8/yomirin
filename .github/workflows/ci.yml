# PR と main への push ごとに、テストを回す(#18)。secrets は使わない。
# paths で絞らない: どれも数十秒で終わり、必須チェックにしたとき飛ばされた job が「待ち」で残らないように。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo # time.js はローカル時刻で日と週を切る。Actions の既定(UTC)だと境がずれる
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "tests/extension/*.test.mjs"

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: server/.python-version
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest # 本物の Anthropic・Upstash は使わない(tests/conftest.py)

  # PR で extension/ を変えたら、版を上げて docs/design.md の版の表に行を足す(#19)。変えていなければすぐ緑
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main と比べる
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/ci/version.mjs pr "$BASE"
