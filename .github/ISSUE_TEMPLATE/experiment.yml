name: 検証・実験
description: 実装の前に測る
title: "[experiment] "
labels: ["experiment"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 何を明らかにしたいか
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: 仮説
  - type: textarea
    id: criteria
    attributes:
      label: 判定基準
      description: 測る前に数字で決め、あとから動かさない
      value: |
        | 指標 | 基準 |
        |---|---|
        |  |  |
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 設計
      description: 実験の仕組み(道具・測る信号の定義・記録の形)・使うもの・時間・条件。docs/ に別の文書を作らない
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 結果
      description: 測ったら書く。判定と、関係する issue の設計に反映すること
