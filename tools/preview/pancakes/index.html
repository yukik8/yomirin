<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>よみりん · パンケーキの小さな劇場</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="../" class="brand">よみりん <small>試写室</small></a><span class="edition">小さなストーリー / 01</span></header>
<main><div class="intro"><span class="eyebrow">PANCAKE THEATRE</span><h1>まだ、のせるの？</h1><p>本を読んでいるあいだ、くまにはくまの物語。</p></div>
